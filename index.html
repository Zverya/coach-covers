<style>
:root{
  --bg:#F5F6FA; --surface:#FFF; --surface-2:#EFF1F7; --line:#DFE3ED;
  --ink:#171A24; --ink-2:#545B71; --ink-3:#858BA0;
  --accent:#2A3F9D; --accent-ink:#FFF; --accent-soft:#E7EAF7;
  --crit:#C0392B; --crit-bg:#FBEBE7; --warn:#9A6206; --warn-bg:#FAF0DC;
  --ok:#14713C; --ok-bg:#E3F2E8; --bad:#A31515; --bad-bg:#FAE8E8;
  --c0:#2A3F9D; --c1:#0F766E; --c2:#7C3AED; --c3:#9A5B0A; --c4:#A81E5B; --c5:#14602F;
  --chip-ink:#FFF; --r:10px;
  --shadow:0 1px 2px rgba(23,26,36,.06), 0 1px 1px rgba(23,26,36,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101219; --surface:#191C26; --surface-2:#212530; --line:#2C313F;
  --ink:#E9EBF3; --ink-2:#A2A9BF; --ink-3:#757D94;
  --accent:#8A9BF0; --accent-ink:#11131B; --accent-soft:#222840;
  --crit:#F08A72; --crit-bg:#2E1E1A; --warn:#E0B255; --warn-bg:#2C2417;
  --ok:#6BC98C; --ok-bg:#16281D; --bad:#EE8686; --bad-bg:#2E1A1A;
  --c0:#94A6F5; --c1:#5ECFC2; --c2:#C4A3FF; --c3:#E0B255; --c4:#F2A0C4; --c5:#6BC98C;
  --chip-ink:#12141B; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top,0) 0 calc(28px + env(safe-area-inset-bottom,0))}
.wrap{max-width:660px; margin:0 auto; padding-inline:16px}
header{padding-block:20px 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
h1{font-family:Oswald,sans-serif; font-weight:600; font-size:23px; text-transform:uppercase;
  letter-spacing:.02em; margin:0; line-height:1.1}
.who{margin-left:auto; font-size:12px; color:var(--ink-2)}
.who button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;
  font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.sub2{color:var(--ink-2);font-size:13px;margin:4px 0 0;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ink-3)}
.stat.c::before{background:var(--crit)} .stat.w::before{background:var(--warn)} .stat.o::before{background:var(--ok)}
.stat b{font-family:Oswald,sans-serif;font-size:27px;font-weight:600;display:block;line-height:1;
  font-variant-numeric:tabular-nums}
.stat.c b{color:var(--crit)} .stat.w b{color:var(--warn)} .stat.o b{color:var(--ok)}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);
  display:block;margin-top:5px;font-weight:500}
.alert{border-radius:10px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;display:flex;
  gap:10px;align-items:flex-start;line-height:1.45}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.note2{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.alert .ic{font-family:Oswald,sans-serif;font-weight:600;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.row > *{flex:1 1 140px;min-width:0}
.row.tight > *{flex:0 0 auto}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.fld select,.fld input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;
  font-family:inherit;text-transform:none;letter-spacing:0;font-weight:400}
.fld select:focus-visible,.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
td.pick{width:34px;text-align:center}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.fchip{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font-family:inherit;font-size:12px;padding:5px 10px;border-radius:999px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:460px){.stats{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:1/-1}}
.rolechip{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;

.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px;
  border:1px solid var(--line);margin-bottom:16px}
.tab{flex:1;appearance:none;border:0;background:transparent;font-family:inherit;font-size:12.5px;
  font-weight:500;color:var(--ink-2);padding:8px 4px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tab .cnt{display:inline-block;min-width:16px;margin-left:4px;padding:0 4px;border-radius:999px;
  background:var(--crit);color:#fff;font-size:10px;font-weight:700;line-height:16px}
h2{font-family:Oswald,sans-serif;font-weight:500;font-size:13px;text-transform:uppercase;
  letter-spacing:.05em;margin:22px 0 8px;color:var(--ink-2)}
h2:first-of-type{margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:11px 13px 11px 15px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--ink-3)}
.card.open::before{background:var(--crit)}
.card.mine::before,.card.done::before{background:var(--ok)}
.card.waiting::before{background:var(--warn)}
.card.bad::before{background:var(--bad)}
.top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.when{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.box{font-size:13px;color:var(--ink-2);font-weight:500}
.pill{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  padding:3px 7px;border-radius:999px;margin-left:auto;white-space:nowrap}
.pill.open{background:var(--crit-bg);color:var(--crit)}
.pill.mine,.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.waiting{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.sub{font-size:13px;color:var(--ink-2);margin-top:5px}
.sub b{color:var(--ink);font-weight:500}
.arrow{color:var(--ink-3);padding-inline:3px}
.soon{color:var(--crit);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button.btn{appearance:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;
  padding:8px 13px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.btn.ghost{background:transparent;color:var(--ink-2)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;
  color:var(--ink-2);font-size:13.5px;background:var(--surface)}
.note{background:var(--warn-bg);border-radius:10px;padding:11px 13px;font-size:13px;
  color:var(--warn);margin-bottom:14px;line-height:1.45}
.note.bad{background:var(--bad-bg);color:var(--bad)}
select,input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.gate{max-width:380px;margin:64px auto;text-align:center}
.gate h1{margin-bottom:8px}
.boxlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);
  font-weight:600;margin:14px 0 8px;text-align:left}
.boxpick{display:flex;flex-direction:column;gap:6px;text-align:left}
.boxrow{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer}
.boxrow input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.gate p{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
/* week grid */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-title{font-family:Oswald,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;
  letter-spacing:.04em;margin:0 auto 0 0}
.cal-sum{font-size:12px;color:var(--ink-2);width:100%;margin:-4px 0 10px}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:2px;border-radius:7px;border:1px solid var(--line)}
.seg button{appearance:none;border:0;background:transparent;font-family:inherit;font-size:11.5px;
  font-weight:500;color:var(--ink-2);padding:5px 11px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  text-align:center;font-weight:600;padding-bottom:2px}
.cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  min-height:76px;padding:5px 5px 4px;display:flex;flex-direction:column;gap:3px;
  overflow:hidden;text-align:left;font-family:inherit;cursor:pointer;color:inherit}
.cal-cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default;min-height:0}
.cal-cell.off{opacity:.45}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal-day{font-size:11px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal-cell.today .cal-day{color:var(--accent)}
.cal-chips{display:flex;flex-direction:column;gap:2px}
.cal-dots{display:none;flex-wrap:wrap;gap:3px}
.cal-chip{font-size:9.5px;line-height:1.35;padding:1px 4px;border-radius:4px;
  color:var(--chip-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.cal-chip.covered{opacity:.55;text-decoration:line-through}
.cal-chip.free{border:1px dashed var(--ok)}
.cal-dot{width:7px;height:7px;border-radius:50%}
.cal-more{font-size:9px;color:var(--ink-3);padding-left:1px}
.cal-detail{margin-top:18px}
.cal-dhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.cal-detail h3{font-family:Oswald,sans-serif;font-weight:500;text-transform:uppercase;
  letter-spacing:.05em;font-size:13px;margin:0;color:var(--ink)}
.lnk{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:12px;
  cursor:pointer;text-decoration:underline;padding:0;margin-left:auto}
.cardline{font-size:13.5px;color:var(--ink-2);margin:6px 0 0}
@media (max-width:640px){
  .cal-cell{min-height:52px}
  .cal-chips{display:none}
  .cal-dots{display:flex}
}
.wk-grid{display:grid;grid-template-columns:46px repeat(7,1fr);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:var(--surface)}
.wk-head{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  font-weight:600;text-align:center;padding:6px 2px;border-bottom:1px solid var(--line);
  border-left:1px solid var(--line)}
.wk-head.today{color:var(--accent)}
.wk-head b{display:block;font-size:12px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.wk-head.today b{color:var(--accent)}
.wk-headgutter{border-bottom:1px solid var(--line)}
.wk-gutter{position:relative}
.wk-hour{position:absolute;right:5px;font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.wk-col{position:relative;border-left:1px solid var(--line)}
.wk-line{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.45}
.wk-ev{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 4px;color:var(--chip-ink);
  font-size:9.5px;line-height:1.25;overflow:hidden;cursor:pointer;border:0;text-align:left;
  font-family:inherit;display:block}
.wk-ev b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.wk-ev.asked{opacity:.5;text-decoration:line-through}
.wk-ev.st-await{background:var(--warn)}
.wk-ev.st-handed{opacity:.42;text-decoration:line-through}
.wk-ev.st-take{background:var(--ok-bg);color:var(--ok);border:1.5px dashed var(--ok);padding:1px 3px}
.wk-ev.st-covering{background:var(--ok)}
.wk-ev .mk{font-weight:600}
.wk-row.st-await i{background:var(--warn)}
.wk-row.st-handed{opacity:.55}
.wk-row.st-take i{background:var(--ok)}
.wk-row.st-covering i{background:var(--ok)}
.wk-row{display:flex;gap:8px;align-items:center;padding:7px 9px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;margin-bottom:4px;width:100%;text-align:left}
.wk-row i{width:8px;height:8px;border-radius:2px;flex:none}
.wk-row .t{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;
  font-variant-numeric:tabular-nums;flex:none;color:var(--ink)}
.wk-row .n{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-row .tag{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;padding:2px 6px;border-radius:999px;white-space:nowrap;flex:none}
.tag.teach{background:var(--surface-2);color:var(--ink-2)}
.tag.await{background:var(--warn-bg);color:var(--warn)}
.tag.handed{background:var(--ok-bg);color:var(--ok)}
.tag.take{background:var(--ok-bg);color:var(--ok)}
.tag.covering{background:var(--ok-bg);color:var(--ok)}
button.wk-row{cursor:pointer;font-family:inherit}
.wk-list{display:none}
.wk-day{margin-bottom:13px}
.wk-day h4{font-family:Oswald,sans-serif;font-weight:500;font-size:12px;text-transform:uppercase;
  letter-spacing:.05em;margin:0 0 5px;color:var(--ink-2)}
.wk-day.today h4{color:var(--accent)}
.wk-none{font-size:12px;color:var(--ink-3);padding:2px 0 0 1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.key{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.key i{width:9px;height:9px;border-radius:2px;display:block;flex:none}
@media (max-width:640px){ .wk-grid{display:none} .wk-list{display:block} }
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--bg);
  font-size:13px;font-weight:500;padding:10px 16px;border-radius:999px;z-index:50;
  box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.foot{color:var(--ink-3);font-size:11.5px;margin-top:26px;line-height:1.5}
</style>

<body>
<div class="wrap" id="app"></div>
<script>
var CONFIG = { url: "https://cdluysgpwnaddqljyzuz.supabase.co", key: "sb_publishable_EnC_Za8GzrsiDzInxDNvGg_kLr_V0V0" };

var TOKEN = (location.hash.match(/t=([A-Za-z0-9_-]+)/) || [])[1] || "";
var ME = null; try { ME = localStorage.getItem("coach-name"); } catch (e) {}
var TAB = null; try { TAB = localStorage.getItem("coach-tab"); } catch (e) {}
var MYBOXES = []; try { MYBOXES = JSON.parse(localStorage.getItem("coach-boxes")||"[]")||[]; } catch (e) { MYBOXES=[]; }

var CALVIEW = null; try { CALVIEW = localStorage.getItem("coach-calview"); } catch (e) {}
var S = { loading:true, err:null, data:null, busy:null, tab:TAB||"schedule", weekStart:null,
          cfilter:"all", calView:CALVIEW||"week", calDay:null, calY:null, calM:null };

function $(s,r){ return (r||document).querySelector(s); }
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function sundayOf(d){ var x=new Date(d.getTime()); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
function mins(t){ var p=String(t||"").slice(0,5).split(":"); var h=+p[0],m=+p[1];
  return (isNaN(h)?0:h)*60+(isNaN(m)?0:m); }
function shortBox(n){ return String(n||"").replace(/^\s*crossfit\s+/i,"").trim()||String(n||""); }
function hm(t){ return String(t||"").slice(0,5); }

function rpc(fn,args){
  return fetch(CONFIG.url+"/rest/v1/rpc/"+fn,{ method:"POST",
    headers:{ "apikey":CONFIG.key, "Authorization":"Bearer "+CONFIG.key, "Content-Type":"application/json" },
    body:JSON.stringify(args) }).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
function toast(m){ var o=document.querySelector(".toast"); if(o)o.remove();
  var t=el("div","toast",m); document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode)t.remove(); },3000); }
function when(r){ var d=new Date(r.date+"T00:00:00");
  var days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  if(isNaN(d.getTime())) return r.date+" "+hm(r.time);
  return days[d.getDay()]+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"  "+hm(r.time); }
function hoursUntil(r){ var d=new Date(r.date+"T"+hm(r.time)+":00");
  return isNaN(d.getTime())?Infinity:(d.getTime()-Date.now())/3600000; }
function isAdmin(){ return S.data && S.data.role==="admin"; }
function isBoxAdmin(){ return S.data && S.data.role==="box_admin"; }
function canConfirm(){ return isAdmin() || isBoxAdmin(); }
function adminBox(){ return (S.data && S.data.adminBox) || null; }

function allCoaches(){ var seen={},o=[]; ((S.data&&S.data.shifts)||[]).forEach(function(s){
  var c=(s.coach||"").trim(); if(c&&!seen[c]){seen[c]=1;o.push(c);} }); return o.sort(); }
function boxes(){ var seen={},o=[]; ((S.data&&S.data.shifts)||[]).forEach(function(s){
  var b=(s.box||"").trim(); if(b&&!seen[b]){seen[b]=1;o.push(b);} }); return o.sort(); }
/* The boxes you coach at take the first palette slots, so your own schedule
   reads in the same colours however many other gyms are on the board. */
function paletteOrder(){
  var all=boxes(), o=[];
  MYBOXES.forEach(function(b){ if(all.indexOf(b)>=0 && o.indexOf(b)<0) o.push(b); });
  all.forEach(function(b){ if(o.indexOf(b)<0) o.push(b); });
  return o;
}
function boxColor(b){ var i=paletteOrder().indexOf((b||"").trim()); return "var(--c"+(i<0?0:i%6)+")"; }

function load(){
  return rpc("board_state",{p_token:TOKEN}).then(function(res){
    S.loading=false;
    if(!res||res.ok===false){ S.err=(res&&res.error)||"unknown"; }
    else { S.err=null; S.data=res; }
    return syncExtras();
  }).then(function(){ render(); })
  .catch(function(){ S.loading=false; S.err="network"; render(); });
}
function syncExtras(){
  var jobs=[];
  // pull this coach's saved boxes from the DB (source of truth across devices)
  if(ME && !S.boxesSynced){
    S.boxesSynced=true;
    jobs.push(rpc("get_coach_boxes",{p_token:TOKEN,p_coach:ME}).then(function(r){
      if(r&&r.ok&&Array.isArray(r.boxes)&&r.boxes.length){
        MYBOXES=r.boxes; try{ localStorage.setItem("coach-boxes",JSON.stringify(MYBOXES)); }catch(e){}
      }
    }).catch(function(){}));
  }
  // approver: pending box requests
  if(isAdmin()){
    jobs.push(rpc("pending_boxes",{p_token:TOKEN}).then(function(r){
      S.boxReqs = (r&&r.ok&&r.boxes)?r.boxes:[];
    }).catch(function(){ S.boxReqs=[]; }));
  }
  return Promise.all(jobs);
}
function saveBoxes(){
  try{ localStorage.setItem("coach-boxes",JSON.stringify(MYBOXES)); }catch(e){}
  if(ME) rpc("set_coach_boxes",{p_token:TOKEN,p_coach:ME,p_boxes:MYBOXES}).catch(function(){});
}

/* ---------------------------------------------------------------- render */
function render(){
  var app=$("#app"); app.innerHTML="";
  if(!TOKEN) return gate(app,"This link is missing its code","Ask whoever sent it for the full link — it ends in #t= then a code.");
  if(S.loading) return gate(app,"Loading…","");
  if(S.err==="network") return gate(app,"Can't reach the board","Check your connection, then refresh.");
  if(S.err==="unknown_board") return gate(app,"This link doesn't work","The code isn't recognised. Ask for a fresh link.");
  if(S.err) return gate(app,"Something went wrong","Try again in a moment.");
  var d=S.data;
  if(!ME) return pickName(app,d);
  if(S.editBoxes) return boxEditor(app,d);

  var head=el("header");
  var titleWrap=el("div"); titleWrap.style.minWidth="0";
  titleWrap.appendChild(el("h1",null,(d.board&&d.board.name)||"Coach Covers"));
  titleWrap.appendChild(el("p","sub2", canConfirm()
    ? "Swaps at your box, whether Arbox was changed, and what the nightly check found."
    : "Your week, the shifts you can pick up, and where your covers stand."));
  head.appendChild(titleWrap);
  if(isAdmin()) head.appendChild(el("span","rolechip","All boxes"));
  else if(isBoxAdmin()) head.appendChild(el("span","rolechip", shortBox(adminBox()||"Box")+" admin"));
  var who=el("div","who");
  who.appendChild(document.createTextNode(ME+" · "));
  var sw=el("button",null,"not you?");
  sw.addEventListener("click",function(){ ME=null;
    try{localStorage.removeItem("coach-name");}catch(e){} render(); });
  who.appendChild(sw);
  who.appendChild(document.createTextNode(" \u00b7 "));
  var bx=el("button",null,"boxes");
  bx.addEventListener("click",function(){ S.editBoxes=true; render(); });
  who.appendChild(bx);
  head.appendChild(who);
  app.appendChild(head);

  var reqs=d.requests||[];
  var openN=reqs.filter(function(r){ return r.status==="open"; }).length;

  // --- stat tiles (scoped to this coach, or to the box for an admin) ---
  var mineR=reqs.filter(function(r){ return r.claimedBy===ME||r.originalCoach===ME||r.createdBy===ME; });
  var t1,t2,t3,l1,l2,l3,bad;
  if(canConfirm()){
    t1=openN; l1=t1===1?"class needs a coach":"classes need a coach";
    t2=reqs.filter(function(r){ return r.status==="claimed"||r.status==="mismatch"; }).length; l2="to update in arbox";
    t3=reqs.filter(function(r){ return r.status==="verified"; }).length; l3="confirmed in arbox";
    bad=reqs.filter(function(r){ return r.status==="mismatch"; });
  } else {
    t1=reqs.filter(function(r){ return r.status==="open" && r.originalCoach!==ME && r.createdBy!==ME
        && (!MYBOXES.length || MYBOXES.indexOf(r.box)>=0); }).length;
    l1=t1===1?"shift you can pick up":"shifts you can pick up";
    t2=mineR.filter(function(r){ return r.status==="claimed"||r.status==="approved"||r.status==="mismatch"; }).length;
    l2="pending arbox update";
    t3=mineR.filter(function(r){ return r.status==="verified"; }).length; l3="confirmed";
    bad=mineR.filter(function(r){ return r.status==="mismatch"; });
  }
  var st=el("div","stats");
  [["c",t1,l1],["w",t2,l2],["o",t3,l3]].forEach(function(x){
    var t=el("div","stat "+x[0]); t.appendChild(el("b",null,String(x[1])));
    t.appendChild(el("span",null,x[2])); st.appendChild(t);
  });
  app.appendChild(st);

  if(bad.length){
    var al=el("div","alert bad");
    al.appendChild(el("span","ic","!"));
    al.appendChild(el("span",null, bad.length+" "+(bad.length===1?"swap was":"swaps were")
      +" marked done, but the nightly check still finds the original coach in Arbox \u2014 the wrong person gets paid until it's fixed."));
    app.appendChild(al);
  }

  var tabs=el("div","tabs");
  function tb(id,label,count){
    var b=el("button","tab"); b.type="button"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", S.tab===id?"true":"false");
    b.appendChild(document.createTextNode(label));
    if(count) { var c=el("span","cnt",String(count)); b.appendChild(c); }
    b.addEventListener("click",function(){ S.tab=id;
      try{localStorage.setItem("coach-tab",id);}catch(e){} render(); });
    tabs.appendChild(b);
  }
  tb("schedule","Schedule",0);
  tb("covers","Covers",openN);
  if(canConfirm()) tb("approvals","To update",t2);
  tb("record","Record",0);
  app.appendChild(tabs);

  if(S.tab==="schedule") { if(S.picker) renderPicker(app,d); else renderSchedule(app,d); }
  else if(S.tab==="approvals" && canConfirm()) renderApprovals(app,d);
  else if(S.tab==="record") renderRecord(app,d);
  else renderCovers(app,d);
}

function gate(app,t,m){ var g=el("div","gate"); g.appendChild(el("h1",null,t));

}

  var send=el("button","btn primary","Add this gym"); send.type="button"; send.style.marginTop="6px";
  send.addEventListener("click",function(){

      if(r&&r.ok){ toast("Got it \u2014 we'll add that gym shortly."); nm.value=""; lk.value=""; form.hidden=true; }

function pickName(app,d){
  var g=el("div","gate");
  g.appendChild(el("h1",null,"Who are you?"));
  g.appendChild(el("p",null,"First tick the boxes you coach at, then pick your name."));

  // 1. boxes (nothing pre-ticked \u2014 the coach chooses)
  g.appendChild(el("div","boxlabel","Boxes you coach at (pick at least one)"));
  var bp=boxCheckboxes(d, []);
  g.appendChild(bp);

  // add a gym that isn't listed
  var nameSel=null;
  g.appendChild(addBoxForm(function(){ return nameSel && nameSel.value; }));

  // 2. name \u2014 appears once a box is ticked, listing only that box's coaches
  var nameWrap=el("div"); nameWrap.hidden=true; nameWrap.style.marginTop="14px"; g.appendChild(nameWrap);
  var go=el("button","btn primary","That's me"); go.style.marginTop="12px"; go.disabled=true;

  function coachesForSelected(){
    var sel=checkedBoxes(bp), set={};
    (d.shifts||[]).forEach(function(x){ if(x.coach && sel.indexOf(x.box)>=0) set[x.coach]=1; });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  }
  function refreshNames(){
    var sel=checkedBoxes(bp);
    if(!sel.length){ nameWrap.hidden=true; nameWrap.innerHTML=""; nameSel=null; go.disabled=true; return; }
    // remember any current pick
    var prev = nameSel ? nameSel.value : "";
    nameWrap.hidden=false; nameWrap.innerHTML="";
    nameWrap.appendChild(el("div","boxlabel","Your name"));
    nameSel=el("select");
    var ph=el("option",null,"Pick your name\u2026"); ph.value=""; nameSel.appendChild(ph);
    var names=coachesForSelected();
    names.forEach(function(c){ var o=el("option",null,c); o.value=c; nameSel.appendChild(o); });
    if(prev && names.indexOf(prev)>=0) nameSel.value=prev;
    nameSel.addEventListener("change",function(){ go.disabled=!nameSel.value; });
    nameWrap.appendChild(nameSel);
    if(!names.length) nameWrap.appendChild(el("p","foot","No coaches listed for that box yet."));
    go.disabled = !nameSel.value;
  }
  bp.addEventListener("change", refreshNames);

  go.addEventListener("click",function(){
    var sel=checkedBoxes(bp);
    if(!sel.length){ toast("Tick at least one box"); return; }
    if(!nameSel || !nameSel.value){ toast("Pick your name"); return; }
    ME=nameSel.value; MYBOXES=sel;
    try{ localStorage.setItem("coach-name",ME); }catch(e){}
    S.boxesSynced=true; saveBoxes();
    render();
  });
  g.appendChild(go); app.appendChild(g);
}
function boxEditor(app,d){
  var g=el("div","gate");
  g.appendChild(el("h1",null,"Your boxes"));
  g.appendChild(el("p",null,"Which boxes do you coach at? You'll be offered cover shifts at these."));

  });

  back.addEventListener("click",function(){ S.editBoxes=false; render(); });

  g.appendChild(addBoxForm(function(){ return ME; }));
  app.appendChild(g);
}

/* ------------------------------------------------------------- my week */
function renderSchedule(app,d){
  var today=new Date(); today.setHours(0,0,0,0);
  if(!S.weekStart) S.weekStart=iso(sundayOf(today));
  if(S.calY==null){ S.calY=today.getFullYear(); S.calM=today.getMonth(); }
  var ws=new Date(S.weekStart+"T00:00:00");
  var days=[]; for(var i=0;i<7;i++){ var x=new Date(ws.getTime()); x.setDate(x.getDate()+i); days.push(iso(x)); }

  var reqByKey={}; (d.requests||[]).forEach(function(r){ reqByKey[r.key]=r; });

  // Whose classes the calendar is showing. Yours by default; pick another coach
  // to see theirs, the way the board does.
  var VIEW = S.schedCoach || ME;
  var other = VIEW !== ME;

  // --- the four layers, per day ---
  function eventsOn(ds){
    var evs=[];
    var mine=(d.shifts||[]).filter(function(s){ return s.coach===VIEW && s.date===ds; });
    var myTimes=mine.map(function(s){ return hm(s.time); });
    // 1. my own classes (with awaiting / handed-over states)
    mine.forEach(function(s){
      var r=reqByKey[s.key];
      var st = !r ? "teach"
             : (r.status==="open"||r.status==="claimed"||r.status==="rejected") ? "await"
             : (r.status==="approved"||r.status==="verified") ? "handed" : "teach";
      evs.push({t:mins(s.time), time:s.time, box:s.box, label:(s.klass||shortBox(s.box)),
                kind:other?"other":"mine", st:st, s:s, r:r});
    });
    if(other) return evs.sort(function(a,b){ return a.t-b.t; });
    // 2. shifts I am free to take, across all boxes (open, not mine, no clash)
    (d.requests||[]).forEach(function(r){
      if(r.date!==ds || r.status!=="open") return;
      if(r.originalCoach===ME || r.createdBy===ME || r.claimedBy===ME) return;
      if(MYBOXES.length && MYBOXES.indexOf(r.box)<0) return; // not a box I coach at
      if(myTimes.indexOf(hm(r.time))>=0) return; // I'm teaching then
      evs.push({t:mins(r.time), time:r.time, box:r.box, label:(r.klass||shortBox(r.box)),
                kind:"take", st:"take", r:r});
    });
    // 3+4. shifts I am covering for others (claimed / confirmed)
    (d.requests||[]).forEach(function(r){
      if(r.date!==ds || r.claimedBy!==ME) return;
      evs.push({t:mins(r.time), time:r.time, box:r.box, label:(r.klass||shortBox(r.box)),
                kind:"cover", st:"covering", r:r});
    });
    return evs.sort(function(a,b){ return a.t-b.t; });
  }
  function tagText(e){
    if(e.kind==="other") return e.st==="await" ? (e.r&&e.r.claimedBy?"cover taken":"needs cover")
                       : e.st==="handed" ? "covered" : "scheduled";
    if(e.kind==="take") return "free";
    if(e.kind==="cover") return "covering";
    if(e.st==="await") return e.r && e.r.claimedBy ? "cover taken" : "needs cover";
    if(e.st==="handed") return "covered";
    return "yours";
  }
  function tagClass(e){
    if(e.kind==="other") return e.st==="await" ? "await" : e.st==="handed" ? "handed" : "teach";
    if(e.kind==="take") return "take";
    if(e.kind==="cover") return "covering";
    if(e.st==="await") return "await";
    if(e.st==="handed") return "handed";
    return "teach";
  }
  function evColor(e){
    if(e.kind==="cover") return "var(--ok)";
    if(e.kind==="take") return "var(--ok-bg)";
    if(e.st==="await") return "var(--warn)";
    return boxColor(e.box);
  }
  function act(e){
    if(e.kind==="other"){ S.calDay=e.s.date; render(); return; }
    if(e.kind==="take"){ doClaim(e.r); return; }
    if(e.kind==="cover"){
      if(e.r.status==="claimed") doRelease(e.r);
      else toast(e.r.status==="verified" ? "Confirmed in Arbox." : "You're covering this — the box admin is updating Arbox.");
      return;
    }
    if(e.st==="await"){ toast(e.r && e.r.claimedBy ? (e.r.claimedBy+" is taking it — pending Arbox update") : "On the board — nobody has taken it yet"); return; }
    if(e.st==="handed"){ toast((e.r&&e.r.claimedBy?e.r.claimedBy:"Someone")+" is covering"+(e.r&&e.r.status==="verified"?", confirmed in Arbox":"")); return; }
    doRaise(e.s); // my class, not yet on the board
  }

  var month = S.calView==="month";
  var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // ---- which dates the current view covers, and their events
  var span=[];
  if(month){
    var dim=new Date(S.calY,S.calM+1,0).getDate();
    for(var dd=1; dd<=dim; dd++) span.push(S.calY+"-"+pad(S.calM+1)+"-"+pad(dd));
  } else { span=days.slice(); }
  var EV={}; var nMine=0,nTake=0,nAwait=0,nCover=0;
  span.forEach(function(ds){
    var evs=eventsOn(ds); EV[ds]=evs;
    evs.forEach(function(e){
      if(e.kind==="take") nTake++;
      else if(e.kind==="cover") nCover++;
      else if(e.st==="await") nAwait++;
      else if(e.st==="teach") nMine++;
    });
  });
  function evsOn(ds){ return EV[ds] || (EV[ds]=eventsOn(ds)); }

  // ---- header: title, week/month switch, navigation
  var we=new Date(ws.getTime()); we.setDate(we.getDate()+6);
  var h=el("div","cal-head");
  h.appendChild(el("h2","cal-title", month
    ? (months[S.calM]+" "+S.calY)
    : (pad(ws.getDate())+"–"+pad(we.getDate())+" "+months[we.getMonth()])));

  var who=el("label","fld"); who.style.flex="0 0 auto";
  var sel=el("select"); sel.setAttribute("aria-label","Whose classes");
  var me=el("option",null,"My classes"); me.value=ME; sel.appendChild(me);
  allCoaches().forEach(function(c){ if(c===ME) return; var o=el("option",null,c); o.value=c; sel.appendChild(o); });
  sel.value=VIEW;
  sel.addEventListener("change",function(){ S.schedCoach = sel.value===ME ? null : sel.value; S.calDay=null; render(); });
  who.appendChild(sel); h.appendChild(who);

  var seg=el("div","seg");
  [["week","Week"],["month","Month"]].forEach(function(v){
    var b=el("button",null,v[1]); b.type="button";
    b.setAttribute("aria-pressed", String(S.calView===v[0]));
    b.addEventListener("click",function(){
      if(S.calView===v[0]) return;
      S.calView=v[0];
      if(v[0]==="month" && S.weekStart){ var a=new Date(S.weekStart+"T00:00:00"); a.setDate(a.getDate()+3); S.calY=a.getFullYear(); S.calM=a.getMonth(); }
      if(v[0]==="week" && S.calDay) S.weekStart=iso(sundayOf(new Date(S.calDay+"T00:00:00")));
      try{ localStorage.setItem("coach-calview",S.calView); }catch(e){}
      render();
    });
    seg.appendChild(b);
  });
  h.appendChild(seg);

  function nav(lbl,fn,aria){ var b=el("button","btn",lbl); b.type="button";
    if(aria) b.setAttribute("aria-label",aria); b.addEventListener("click",fn); h.appendChild(b); }
  nav("←",function(){
    if(month){ var m=S.calM-1,y=S.calY; if(m<0){m=11;y--;} S.calM=m; S.calY=y; }
    else { var w=new Date(S.weekStart+"T00:00:00"); w.setDate(w.getDate()-7); S.weekStart=iso(w); }
    S.calDay=null; render();
  },"Previous");
  nav("Today",function(){
    var t=new Date(); t.setHours(0,0,0,0);
    S.weekStart=iso(sundayOf(t)); S.calY=t.getFullYear(); S.calM=t.getMonth(); S.calDay=iso(t); render();
  });
  nav("→",function(){
    if(month){ var m=S.calM+1,y=S.calY; if(m>11){m=0;y++;} S.calM=m; S.calY=y; }
    else { var w=new Date(S.weekStart+"T00:00:00"); w.setDate(w.getDate()+7); S.weekStart=iso(w); }
    S.calDay=null; render();
  },"Next");

  var bits=[];
  bits.push(other ? (nMine+(nMine===1?" class":" classes")) : (nMine+" yours"));
  if(nAwait) bits.push(nAwait+" awaiting cover");
  if(nTake) bits.push(nTake+" you can pick up");
  if(nCover) bits.push(nCover+" you're covering");
  h.appendChild(el("p","cal-sum", bits.join(" · ") + (month?" this month":" this week")));
  app.appendChild(h);

  if(month) monthGrid(); else weekGrid();

  // ---- month: 7-column grid of days
  function monthGrid(){
    var firstDow=new Date(S.calY,S.calM,1).getDay();
    var dim=new Date(S.calY,S.calM+1,0).getDate();
    var g=el("div","cal-grid");
    dow.forEach(function(x){ g.appendChild(el("div","cal-dow",x)); });
    for(var b=0;b<firstDow;b++) g.appendChild(el("div","cal-cell blank"));
    for(var dn=1; dn<=dim; dn++){
      var ds=S.calY+"-"+pad(S.calM+1)+"-"+pad(dn);
      var evs=evsOn(ds);
      var cell=el("button","cal-cell"); cell.type="button";
      if(ds===iso(today)) cell.className+=" today";
      if(ds===S.calDay) cell.className+=" sel";
      if(!evs.length) cell.className+=" off";
      cell.setAttribute("aria-label", ds+", "+evs.length+" classes");
      cell.appendChild(el("div","cal-day",String(dn)));
      var chips=el("div","cal-chips"), dots=el("div","cal-dots");
      evs.slice(0,3).forEach(function(e){
        var c=el("div","cal-chip"+(e.st==="handed"?" covered":"")+(e.kind==="take"?" free":""),
                 hm(e.time)+" "+shortBox(e.box));
        c.style.background=evColor(e);
        if(e.kind==="take") c.style.color="var(--ok)";
        chips.appendChild(c);
        var dt1=el("div","cal-dot"); dt1.style.background=evColor(e); dots.appendChild(dt1);
      });
      if(evs.length>3){
        chips.appendChild(el("div","cal-more","+"+(evs.length-3)+" more"));
        evs.slice(3).forEach(function(e){ var dt2=el("div","cal-dot"); dt2.style.background=evColor(e); dots.appendChild(dt2); });
      }
      cell.appendChild(chips); cell.appendChild(dots);
      (function(dsv){ cell.addEventListener("click",function(){
        S.calDay = (S.calDay===dsv ? null : dsv); render();
      }); })(ds);
      g.appendChild(cell);
    }
    app.appendChild(g);
  }

  // ---- week: time grid + stacked list on phones
  function weekGrid(){
    var allT=[]; days.forEach(function(ds){ evsOn(ds).forEach(function(e){ allT.push(e.t); }); });
    var minH=6,maxH=21;
    if(allT.length){ minH=Math.max(0,Math.floor(Math.min.apply(null,allT)/60)-1);
      maxH=Math.min(24,Math.ceil(Math.max.apply(null,allT)/60)+2);
      if(maxH-minH<6) maxH=Math.min(24,minH+6); }
    var ROW=34,PAD=9,H=(maxH-minH)*ROW+PAD*2;

    var g=el("div","wk-grid");
    g.appendChild(el("div","wk-headgutter"));
    days.forEach(function(ds,i){

    list.forEach(function(e){
      var cls = e.kind==="take" ? "open" : e.kind==="cover" ? "mine"
              : e.st==="await" ? "waiting" : e.st==="handed" ? "done" : "";

      var acts=el("div","acts");
      function btn(lbl,cls2,fn){ var b=el("button","btn"+(cls2?" "+cls2:""),lbl); b.type="button";

        b.addEventListener("click",fn); acts.appendChild(b); }

      if(e.kind==="take") btn("Take this shift","primary",function(){ doClaim(e.r); });
      else if(e.kind==="cover"){

        if(canConfirm()) btn(e.r.status==="approved"||e.r.status==="verified"?"Confirmed":"Confirm in Arbox","",function(){ doConfirm(e.r,false); });
      }
      else if(e.st==="teach"){ if(!other || canConfirm()) btn("Ask for cover","primary",function(){ doRaise(e.s); }); }
      else if(e.st==="await" || e.st==="handed"){

  function copyOne(e){
    var dt=new Date(S.calDay+"T00:00:00");

    var head=full[dt.getDay()]+" "+pad(dt.getDate())+"/"+pad(dt.getMonth()+1)+" "+hm(e.time)+" — "+e.label+" @ "+e.box;
    var txt = e.r && e.r.claimedBy
      ? head+"\n"+(e.r.originalCoach||ME)+"  ->  "+e.r.claimedBy+"\nPlease update the coach on this class in Arbox."

}

/* -------------------------------------------------------------- picker */
/* Narrow by coach or date, tick the rows, raise them all in one go. Mirrors
   the board's step 3; the schedule is already loaded, so there is nothing to paste. */
function renderPicker(app,d){
  var today=new Date(); today.setHours(0,0,0,0);
  if(!S.pk){ var to=new Date(today.getTime()); to.setDate(to.getDate()+13);
    S.pk={coach:ME, from:iso(today), to:iso(to), sel:{}}; }
  var P=S.pk;
  var reqByKey={}; (d.requests||[]).forEach(function(r){ reqByKey[r.key]=r; });

  var back=el("div","row tight"); back.style.marginBottom="14px";
  var bb=el("button","btn ghost","\u2190 Back to schedule"); bb.type="button";
  bb.addEventListener("click",function(){ S.picker=false; render(); });
  back.appendChild(bb); app.appendChild(back);

  app.appendChild(el("h2",null,"Pick the shifts that need cover"));
  app.appendChild(el("p","sub2","Narrow by coach or date, then tick the rows. Raising them puts each one on the board for the others to take."));

  var row=el("div","row");
  function fld(label,node){ var l=el("label","fld"); l.appendChild(el("span",null,label)); l.appendChild(node); row.appendChild(l); return node; }
  var cs=el("select");
  if(canConfirm()){ allCoaches().forEach(function(c){ var o=el("option",null,c); o.value=c; cs.appendChild(o); }); }
  else { var o1=el("option",null,ME); o1.value=ME; cs.appendChild(o1); cs.disabled=true; }
  cs.value=P.coach; cs.addEventListener("change",function(){ P.coach=cs.value; P.sel={}; render(); });
  fld("Coach",cs);
  var fi=el("input"); fi.type="date"; fi.value=P.from; fi.addEventListener("change",function(){ P.from=fi.value; render(); }); fld("From",fi);
  var ti=el("input"); ti.type="date"; ti.value=P.to; ti.addEventListener("change",function(){ P.to=ti.value; render(); }); fld("To",ti);
  app.appendChild(row);

  var shown=(d.shifts||[]).filter(function(x){
    return x.coach===P.coach && (!P.from || x.date>=P.from) && (!P.to || x.date<=P.to);
  }).sort(function(a,b){ return (a.date+hm(a.time)).localeCompare(b.date+hm(b.time)); });

  if(!shown.length){ app.appendChild(el("div","empty","No classes for "+P.coach+" in that range.")); return; }

  var sc=el("div","tscroll"), t=el("table"), th=el("tr");
  ["","When","Box","Class","Status"].forEach(function(x){ th.appendChild(el("th",null,x)); });
  t.appendChild(th);
  shown.forEach(function(x){
    var r=reqByKey[x.key]; var onBoard=!!r && r.status!=="rejected";
    var tr=el("tr"); var td=el("td","pick");
    var cb=el("input"); cb.type="checkbox"; cb.checked=!!P.sel[x.key]; cb.disabled=onBoard;
    cb.addEventListener("change",function(){ if(cb.checked) P.sel[x.key]=1; else delete P.sel[x.key]; refreshCount(); });
    td.appendChild(cb); tr.appendChild(td);
    tr.appendChild(el("td","mono",when(x)));
    tr.appendChild(el("td",null,shortBox(x.box)));
    tr.appendChild(el("td",null,x.klass||"class"));
    var stt = !r ? "\u2014"
            : r.status==="open" ? "on the board"
            : r.status==="claimed" ? "taken by "+(r.claimedBy||"?")
            : r.status==="verified" ? "confirmed"
            : r.status==="approved" ? "updated in Arbox"
            : r.status==="mismatch" ? "needs checking" : r.status;
    tr.appendChild(el("td",null,stt));
    t.appendChild(tr);
  });
  sc.appendChild(t); app.appendChild(sc);

  var acts=el("div","row tight"); acts.style.marginTop="10px";
  var go=el("button","btn primary","Need cover for these"); go.type="button";
  function refreshCount(){ var n=Object.keys(P.sel).length; go.textContent = n ? "Need cover for these ("+n+")" : "Need cover for these"; go.disabled=!n || !!S.busy; }
  go.addEventListener("click",function(){ raiseMany(Object.keys(P.sel)); });
  var all=el("button","btn ghost","Select all shown"); all.type="button";
  all.addEventListener("click",function(){ shown.forEach(function(x){ var r=reqByKey[x.key]; if(!r || r.status==="rejected") P.sel[x.key]=1; }); render(); });
  var clr=el("button","btn ghost","Clear"); clr.type="button";
  clr.addEventListener("click",function(){ P.sel={}; render(); });
  acts.appendChild(go); acts.appendChild(all); acts.appendChild(clr); app.appendChild(acts);
  refreshCount();
  app.appendChild(el("p","foot","Already-raised classes are greyed out. Nothing here changes Arbox \u2014 the box admin does that once someone takes the shift."));
}
function raiseMany(keys){
  if(!keys.length) return;
  S.busy="bulk"; render();
  var done=0, dup=0;
  (function next(i){
    if(i>=keys.length){
      S.busy=null; if(S.pk) S.pk.sel={};
      toast(done ? (done+" put on the board"+(dup?", "+dup+" already there":"")) : "Already on the board.");
      return load();
    }
    rpc("raise_cover",{p_token:TOKEN,p_key:keys[i],p_coach:ME})
      .then(function(res){ if(res&&res.ok) done++; else dup++; next(i+1); })
      .catch(function(){ S.busy=null; toast("Couldn't reach the board \u2014 "+done+" raised so far."); load(); });
  })(0);
}

function cardFor(r,cls,pill){

  top.appendChild(el("span","when",when(r)));
  top.appendChild(el("span","box",shortBox(r.box)));

}

  var F=S.cfilter||"all";

   ["asked","You asked"],["done","Confirmed"]].forEach(function(o){
    var b=el("button","fchip",o[1]); b.type="button";

  if(F==="done"){

    if(!doneL.length) app.appendChild(el("div","empty","Nothing confirmed yet."));
    else { var dl=el("div","list");
      doneL.forEach(function(r){
        var c=cardFor(r,"done","Confirmed");
        var sx=el("div","sub");
        sx.appendChild(document.createTextNode((r.klass||"class")+" · "));
        sx.appendChild(el("b",null,r.originalCoach||"someone"));
        sx.appendChild(el("span","arrow","→"));
        sx.appendChild(el("b",null,r.claimedBy||"?"));
        c.appendChild(sx); dl.appendChild(c);
      });
      app.appendChild(dl);
    }
    app.appendChild(el("p","foot","Confirmed means the nightly check found the cover already in Arbox."));
    return;
  }

  if(F==="all"||F==="open")
  app.appendChild(el("h2",null,open.length?("Needs a coach ("+open.length+")"):"Needs a coach"));
  if(F==="all"||F==="open"){
  if(!open.length) app.appendChild(el("div","empty","Nothing open right now."));
  else { var l=el("div","list"); open.forEach(function(r){
    var c=cardFor(r,"open","Needs a coach");
    var s=el("div","sub");
    s.appendChild(document.createTextNode((r.klass||"class")+" · was "));
    s.appendChild(el("b",null,r.originalCoach||"unassigned"));
    var h=hoursUntil(r);
    if(h<24&&h>-2){ s.appendChild(document.createTextNode(" · "));
      s.appendChild(el("span","soon",h<0?"starting now":"in "+Math.max(1,Math.round(h))+"h")); }
    c.appendChild(s);
    var a=el("div","acts");
    if(r.createdBy===ME) a.appendChild(el("span","sub","You asked for this one."));
    else { var b=el("button","btn primary",S.busy===r.id?"…":"I'll take it");
      b.disabled=S.busy===r.id; b.addEventListener("click",function(){ doClaim(r); }); a.appendChild(b); }
    c.appendChild(a); l.appendChild(c); }); app.appendChild(l); } }

  if(mine.length && (F==="all"||F==="covering")){
    app.appendChild(el("h2",null,"You're covering ("+mine.length+")"));
    var l2=el("div","list");
    mine.forEach(function(r){
      var cls = r.status==="verified" ? "done" : (r.status==="claimed" ? "waiting" : (r.status==="mismatch"?"bad":"mine"));
      var pill = r.status==="claimed" ? "Pending Arbox update"
               : r.status==="approved" ? "Approved"
               : r.status==="verified" ? "Confirmed"
               : r.status==="mismatch" ? "Not in Arbox yet" : r.status;
      var c=cardFor(r,cls,pill);

      s.appendChild(document.createTextNode((r.klass||"class")+" · for "));
      s.appendChild(el("b",null,r.originalCoach||"someone"));
      c.appendChild(s);
      if(r.note) c.appendChild(el("div","sub","Note: "+r.note));
      if(r.status==="claimed"){
        var a=el("div","acts");

        b.addEventListener("click",function(){ doRelease(r); });
        a.appendChild(b); c.appendChild(a);
      }
      l2.appendChild(c);

    +"The box admin then changes it in Arbox, and a nightly check confirms it landed."));
}

      a.appendChild(ok); c.appendChild(a);
      l.appendChild(c);
    });
    app.appendChild(l);
    var a1=el("div","acts");
    var cp1=el("button","btn","Copy the change list");
    cp1.addEventListener("click",function(){ copyChanges(waiting.concat(bad)); });
    a1.appendChild(cp1); app.appendChild(a1);
  }

  if(approved.length){
    app.appendChild(el("h2",null,"Marked done — awaiting tonight's check ("+approved.length+")"));
    var l2=el("div","list");
    approved.forEach(function(r){
      var c=cardFor(r,"mine","Marked done");
      c.appendChild(swapLine(r));
      var a=el("div","acts");
      var un=el("button","btn ghost","Not actually done");
      un.addEventListener("click",function(){ doConfirm(r,true); });
      a.appendChild(un); c.appendChild(a);
      l2.appendChild(c);
    });
    app.appendChild(l2);
  }

  if(bad.length){
    app.appendChild(el("h2",null,"Still wrong in Arbox ("+bad.length+")"));
    var l3=el("div","list");
    bad.forEach(function(r){
      var c=cardFor(r,"bad","Not updated");
      var s=el("div","sub");
      s.appendChild(document.createTextNode("Arbox says "));
      s.appendChild(el("b",null,r.checkedCoach||"the original coach"));
      s.appendChild(document.createTextNode(", but "));
      s.appendChild(el("b",null,r.claimedBy||"someone else"));
      s.appendChild(document.createTextNode(" is covering."));
      c.appendChild(s);
      var a3=el("div","acts");
      var fix=el("button","btn primary","Fixed it \u2014 updated now");
      fix.addEventListener("click",function(){ doConfirm(r,false); });
      a3.appendChild(fix); c.appendChild(a3);
      l3.appendChild(c);
    });
    app.appendChild(l3);
  }

  if(open.length){
    app.appendChild(el("h2",null,"Still needs a coach ("+open.length+")"));
    var l4=el("div","list");
    open.forEach(function(r){
      var c=cardFor(r,"open","Nobody yet");
      var s=el("div","sub");
      s.appendChild(document.createTextNode((r.klass||"class")+" · asked by "));
      s.appendChild(el("b",null,r.createdBy||r.originalCoach||"someone"));
      c.appendChild(s);
      l4.appendChild(c);
    });
    app.appendChild(l4);
  }

  if(done.length) app.appendChild(el("p","foot",done.length+" swap"+(done.length===1?"":"s")+" confirmed in Arbox."));
}

function copyText(txt){
  function fb(){ var ta=document.createElement("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); var ok=false; try{ok=document.execCommand("copy");}catch(e){}
    ta.remove(); toast(ok?"Copied":"Couldn't copy"); }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){toast("Copied");},fb);
  else fb();
}
function copyChanges(rs){
  var lines=["Please update the coach on these classes:",""];
  rs.slice().sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); })
    .forEach(function(r){
      lines.push("• "+when(r)+" — "+(r.klass||"class")+" @ "+r.box);
      lines.push("    "+(r.originalCoach||"unassigned")+"  ->  "+(r.claimedBy||"TBC"));
    });
  lines.push(""); lines.push("All approved. Flagging because the hours need to land on the coach who actually taught.");
  copyText(lines.join("\n"));
}

/* ------------------------------------------------------------- actions */
function doClaim(r){
  S.busy=r.id; render();
  rpc("claim_cover",{p_token:TOKEN,p_request:r.id,p_coach:ME}).then(function(res){
    S.busy=null;
    if(res&&res.ok) toast(res.clash?"Taken — but you're already on at another box then. Check it.":"Yours. The box admin will update Arbox.");
    else if(res&&res.error==="taken") toast((res.takenBy||"Someone")+" got there first.");
    else toast("Couldn't take it — try again.");
    return load();
  }).catch(function(){ S.busy=null; toast("Couldn't reach the board."); render(); });
}
function doRelease(r){
  S.busy=r.id; render();
  rpc("release_cover",{p_token:TOKEN,p_request:r.id,p_coach:ME}).then(function(res){
    S.busy=null; toast(res&&res.ok?"Put back on the board.":"Too late to undo — tell the coach directly.");
    return load();
  }).catch(function(){ S.busy=null; toast("Couldn't reach the board."); render(); });
}
function doRaise(s){
  S.busy=s.key; render();
  rpc("raise_cover",{p_token:TOKEN,p_key:s.key,p_coach:ME}).then(function(res){
    S.busy=null; toast(res&&res.ok?"Asked. The others can see it now.":"Already on the board.");
    return load();
  }).catch(function(){ S.busy=null; toast("Couldn't reach the board."); render(); });
}
function resolveBox(id,status){
  rpc("resolve_box",{p_token:TOKEN,p_id:id,p_status:status}).then(function(r){
    toast(status==="added"?"Marked added.":"Declined.");
    S.boxReqs=(S.boxReqs||[]).filter(function(b){ return b.id!==id; });
    render();
  }).catch(function(){ toast("Couldn't reach the board."); });
}
function doConfirm(r,undo){
  S.busy=r.id; render();
  rpc("confirm_updated",{p_token:TOKEN,p_request:r.id,p_undo:!!undo})
  .then(function(res){
    S.busy=null;
    if(res&&res.ok) toast(undo ? "Put back on your list." : "Marked done. Tonight's check will confirm it.");
    else if(res&&res.error==="not_admin") toast("Your link can't do that.");
    else toast("Already handled.");
    return load();
  }).catch(function(){ S.busy=null; toast("Couldn't reach the board."); render(); });
}

render(); load();
setInterval(function(){ if(!document.hidden && !S.busy && ME && !S.editBoxes) load(); },20000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
</script>
